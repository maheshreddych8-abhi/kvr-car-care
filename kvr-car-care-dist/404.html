<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KVR Car Care | Loading Mobile App...</title>
  <script>
    // GitHub Pages SPA router - redirect all subpaths to index.html
    const pathname = window.location.pathname;
    let target = 'index.html';
    if (pathname.includes('owner')) {
      target = 'index.html?role=owner';
    } else if (pathname.includes('customer')) {
      target = 'index.html?role=customer';
    }
    window.location.replace(target + (window.location.hash || ''));
  </script>
</head>
<body style="background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <div style="font-size: 36px; margin-bottom: 12px;">🚗</div>
    <div style="font-size: 16px; font-weight: bold; color: #f5b800;">Opening KVR Car Care Mobile App...</div>
    <p style="font-size: 12px; color: #94a3b8; margin-top: 8px;"><a href="index.html" style="color: #38bdf8;">Click here to open app</a></p>
  </div>
</body>
</html>
