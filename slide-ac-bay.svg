<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg)"/>
  
  <!-- Floor Grid -->
  <line x1="0" y1="230" x2="600" y2="230" stroke="#334155" stroke-width="2"/>
  <rect x="0" y="230" width="600" height="70" fill="#090d16"/>
  
  <!-- AC Service Machine Station -->
  <rect x="70" y="90" width="85" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="85" y="105" width="55" height="40" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <circle cx="100" cy="125" r="12" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="125" cy="125" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="85" y="155" width="55" height="20" rx="3" fill="#0284c7"/>
  <text x="112" y="169" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">R134a REFILL</text>
  <line x1="140" y1="180" x2="260" y2="190" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="185" x2="260" y2="195" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Serviced SUV / Car in Bay -->
  <g transform="translate(240, 110)">
    <!-- Car body (Blue) -->
    <path d="M 10,95 L 30,65 L 60,35 L 140,35 L 190,65 L 250,75 L 265,95 L 265,115 L 240,115 A 18,18 0 0 1 204,115 L 80,115 A 18,18 0 0 1 44,115 L 10,115 Z" fill="#2563eb" stroke="#60a5fa" stroke-width="3"/>
    <!-- Windows -->
    <path d="M 65,42 L 100,42 L 100,65 L 45,65 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 106,42 L 135,42 L 175,65 L 106,65 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- KVR Nameplate on Door -->
    <rect x="82" y="75" width="55" height="20" rx="4" fill="#0f172a" stroke="#f5b800" stroke-width="2"/>
    <text x="109" y="90" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">KVR</text>
    <!-- Open Hood showing AC Compressor check -->
    <polygon points="190,65 240,30 255,75" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="62" cy="115" r="16" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="222" cy="115" r="16" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
  </g>
  
  <!-- Badge Overlays -->
  <rect x="20" y="20" width="230" height="34" rx="8" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="32" y="42" font-family="sans-serif" font-size="13" font-weight="900" fill="#38bdf8">❄️ AC SPECIALIST GARAGE BAY</text>
  
  <rect x="360" y="245" width="220" height="30" rx="6" fill="#1e293b" opacity="0.95" stroke="#f5b800" stroke-width="1"/>
  <text x="470" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f5b800" text-anchor="middle">Precision Cooling Overhaul</text>
</svg>
