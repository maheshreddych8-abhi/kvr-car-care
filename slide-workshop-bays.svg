<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bayBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="15%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="liftSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueCarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Workshop Wall -->
  <rect width="800" height="450" fill="url(#bayBg)"/>

  <!-- Workshop Structural Pillars & Overhead Beam -->
  <rect x="0" y="30" width="800" height="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="50" y="30" width="24" height="280" fill="#1e293b" stroke="#334155"/>
  <rect x="726" y="30" width="24" height="280" fill="#1e293b" stroke="#334155"/>

  <!-- Overhead LED Shop Lighting -->
  <rect x="180" y="36" width="180" height="6" rx="3" fill="#f8fafc" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <rect x="440" y="36" width="180" height="6" rx="3" fill="#f8fafc" filter="drop-shadow(0 0 8px #38bdf8)"/>

  <!-- Workshop Wall Signage -->
  <rect x="260" y="58" width="280" height="44" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="82" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="2">KVR CAR CARE</text>
  <text x="400" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">MULTI-BRAND WORKSHOP • PALAKALURU ROAD, GUNTUR</text>

  <!-- High-Gloss Epoxy Floor -->
  <polygon points="0,310 800,310 800,450 0,450" fill="url(#floorGrad)"/>
  <!-- Floor Yellow Safety Lines -->
  <line x1="80" y1="315" x2="20" y2="450" stroke="#f59e0b" stroke-width="3" stroke-dasharray="16,10"/>
  <line x1="720" y1="315" x2="780" y2="450" stroke="#f59e0b" stroke-width="3" stroke-dasharray="16,10"/>
  <line x1="220" y1="312" x2="580" y2="312" stroke="#f59e0b" stroke-width="3"/>

  <!-- Heavy Duty Hydraulic Two-Post Lift (Bay 1) -->
  <!-- Left Post -->
  <rect x="230" y="90" width="30" height="225" fill="url(#liftSteel)" stroke="#1e293b"/>
  <rect x="225" y="305" width="40" height="10" fill="#0f172a"/>
  <!-- Right Post -->
  <rect x="540" y="90" width="30" height="225" fill="url(#liftSteel)" stroke="#1e293b"/>
  <rect x="535" y="305" width="40" height="10" fill="#0f172a"/>

  <!-- Lift Cross Bar & Arms -->
  <rect x="245" y="240" width="310" height="14" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="260,240 290,215 320,240" fill="#475569"/>
  <polygon points="480,240 510,215 540,240" fill="#475569"/>

  <!-- ================= ELEVATED BLUE KVR CAR ================= -->
  <g transform="translate(250, 140)">
    <!-- Car Body -->
    <path d="M 15,68 L 35,50 L 75,26 L 195,26 L 245,50 L 285,56 L 292,68 L 292,80 L 270,80 A 18,18 0 0 1 234,80 L 86,80 A 18,18 0 0 1 50,80 L 15,80 Z" fill="url(#blueCarGrad)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Windows -->
    <path d="M 78,30 L 126,30 L 126,48 L 54,48 Z" fill="#0f172a" opacity="0.9"/>
    <path d="M 134,30 L 188,30 L 230,48 L 134,48 Z" fill="#0f172a" opacity="0.9"/>
    <!-- Door Emblem "KVR" -->
    <rect x="100" y="52" width="60" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="130" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">KVR</text>
    <!-- Headlight Xenon & Taillight -->
    <polygon points="282,58 290,62 284,66" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)"/>
    <rect x="15" y="60" width="8" height="6" rx="2" fill="#ef4444"/>
    <!-- Alloy Wheels -->
    <circle cx="68" cy="80" r="16" fill="#0f172a" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="68" cy="80" r="6" fill="#38bdf8"/>
    <circle cx="252" cy="80" r="16" fill="#0f172a" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="252" cy="80" r="6" fill="#38bdf8"/>
  </g>

  <!-- Left: Red Professional Tool Chest & Workbench -->
  <g transform="translate(90, 230)">
    <rect x="0" y="0" width="80" height="85" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <rect x="6" y="8" width="68" height="10" rx="2" fill="#b91c1c" stroke="#fecaca" stroke-width="0.5"/>
    <rect x="6" y="24" width="68" height="10" rx="2" fill="#b91c1c" stroke="#fecaca" stroke-width="0.5"/>
    <rect x="6" y="40" width="68" height="10" rx="2" fill="#b91c1c" stroke="#fecaca" stroke-width="0.5"/>
    <rect x="6" y="56" width="68" height="22" rx="2" fill="#991b1b"/>
    <circle cx="70" cy="87" r="4" fill="#0f172a"/>
    <circle cx="10" cy="87" r="4" fill="#0f172a"/>
  </g>

  <!-- Right: Digital Diagnostics Cart & Scanner Station -->
  <g transform="translate(630, 220)">
    <rect x="0" y="20" width="65" height="75" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Screen -->
    <rect x="8" y="0" width="50" height="32" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <polyline points="14,16 22,12 28,22 36,8 44,18 52,14" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    <!-- Cart Shelves -->
    <line x1="6" y1="45" x2="59" y2="45" stroke="#475569" stroke-width="2"/>
    <line x1="6" y1="65" x2="59" y2="65" stroke="#475569" stroke-width="2"/>
    <circle cx="8" cy="98" r="4" fill="#0f172a"/>
    <circle cx="57" cy="98" r="4" fill="#0f172a"/>
  </g>

  <!-- Workshop Specialist Technician -->
  <g transform="translate(370, 240)">
    <!-- Head & Cap -->
    <circle cx="30" cy="20" r="10" fill="#fcd34d"/>
    <path d="M 20,18 C 20,10 40,10 40,18 Z" fill="#2563eb"/>
    <path d="M 28,15 L 44,15" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <!-- Body / Overalls -->
    <path d="M 18,30 L 42,30 L 44,65 L 34,65 L 34,80 L 26,80 L 26,65 L 16,65 Z" fill="#1e3a8a" stroke="#2563eb" stroke-width="1"/>
    <!-- Wrench in hand -->
    <rect x="42" y="38" width="16" height="4" rx="2" fill="#94a3b8" transform="rotate(30 42 38)"/>
  </g>
</svg>
